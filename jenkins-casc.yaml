# Jenkins Configuration as Code (JCasC)
# Wymaga wtyczek: configuration-as-code, job-dsl, workflow-aggregator, nodejs, docker-workflow, git
# Zmienne ${...} są odczytywane ze zmiennych środowiskowych kontenera / systemu.

jenkins:
  systemMessage: "Jenkins skonfigurowany automatycznie przez JCasC"
  numExecutors: 2
  mode: NORMAL
  quietPeriod: 5
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: false

  globalNodeProperties:
    - envVars:
        env:
          - key: "DOCKER_REGISTRY"
            value: "docker.io"

security:
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8080/}"
    adminAddress: "admin@example.com"
  # Timeout buildów ustawiany jest w samym pipeline: options { timeout(time: 30, unit: 'MINUTES') }

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              description: "Docker Hub"
              username: "${DOCKERHUB_USER}"
              password: "${DOCKERHUB_TOKEN}"

tool:
  git:
    installations:
      - name: "Default"
        home: "git"

  maven:
    installations:
      - name: "Maven-3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.6"

  nodejs:
    installations:
      - name: "NodeJS-20"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "20.11.1"
                    npmPackagesRefreshHours: 72

  dockerTool:
    installations:
      - name: "Docker"
        properties:
          - installSource:
              installers:
                - fromDocker:
                    version: "latest"

jobs:
  - script: >
      pipelineJob('przykladowy-pipeline') {
        description('Przykładowy pipeline utworzony przez JCasC + Job DSL')
        logRotator {
          numToKeep(20)
        }
        triggers {
          scm('H/5 * * * *')
        }
        definition {
          cps {
            sandbox(true)
            script('''
              pipeline {
                agent any
                tools { nodejs 'NodeJS-20' }
                options { timeout(time: 30, unit: 'MINUTES') }
                stages {
                  stage('Checkout') {
                    steps { git url: 'https://github.com/jenkins-docs/simple-node-js-react-npm-app.git', branch: 'master' }
                  }
                  stage('Install') {
                    steps { sh 'npm install' }
                  }
                  stage('Test') {
                    steps { sh 'npm test || true' }
                  }
                }
              }
            '''.stripIndent())
          }
        }
      }
